name: mediapad_app
description: "Super cool Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.6.0
  firebase_auth: ^6.3.0
  cloud_firestore: ^6.2.0
  firebase_ui_auth: ^3.0.1
  flutter_dotenv: ^6.0.0
  provider: ^6.1.5+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  test: ^1.26.3

flutter:
  uses-material-design: true
  assets:
    - assets/.env
    - assets/images/
  fonts:
    - family: Silkscreen
      fonts:
        - asset: fonts/Silkscreen-Regular.ttf
        - asset: fonts/Silkscreen-Bold.ttf
